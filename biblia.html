<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Carga Elétrica por Circuito</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
        }

        button {
            background: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
        }

        .ok {
            background: #d4edda;
            color: #155724;
        }

        .erro {
            background: #f8d7da;
            color: #721c24;
        }

        ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>

<h1>Calculadora de Uso Concomitante</h1>

<label for="circuito">Selecione o circuito:</label>
<select id="circuito">
    <option value="600">Iluminação Geral (600 W)</option>
    <option value="2300">Tomada Cozinha (2300 W)</option>
    <option value="1800">Tomada Área de Serviço (1800 W)</option>
    <option value="1400">Tomada Uso Geral (1400 W)</option>
    <option value="700">Ar-condicionado 220V (700 W)</option>
</select>

<label for="potencia">Potência do aparelho (W):</label>
<input type="number" id="potencia" placeholder="Ex: 800">

<button onclick="adicionar()">Adicionar aparelho</button>

<ul id="lista"></ul>

<button onclick="calcular()">Calcular carga total</button>

<div id="resultado"></div>

<script>
    let cargas = [];

    function adicionar() {
        const potencia = Number(document.getElementById("potencia").value);

        if (!potencia || potencia <= 0) {
            alert("Informe uma potência válida.");
            return;
        }

        cargas.push(potencia);

        const lista = document.getElementById("lista");
        const item = document.createElement("li");
        item.textContent = potencia + " W";
        lista.appendChild(item);

        document.getElementById("potencia").value = "";
    }

    function calcular() {
        const limite = Number(document.getElementById("circuito").value);
        const total = cargas.reduce((a, b) => a + b, 0);

        const resultado = document.getElementById("resultado");

        if (total <= limite) {
            resultado.className = "resultado ok";
            resultado.innerHTML = `
                ✅ Carga total: <strong>${total} W</strong><br>
                Limite do circuito: <strong>${limite} W</strong><br>
                Situação: dentro do permitido.
            `;
        } else {
            resultado.className = "resultado erro";
            resultado.innerHTML = `
                ⚠️ Carga total: <strong>${total} W</strong><br>
                Limite do circuito: <strong>${limite} W</strong><br>
                Situação: <strong>EXCEDE o limite do disjuntor!</strong>
            `;
        }
    }
</script>

</body>
</html>
